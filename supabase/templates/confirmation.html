<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:24px;background:#F5F5F5;color:#212121;font-family:Arial,sans-serif">
<div style="max-width:480px;margin:auto;padding:24px;background:#FFFFFF;border:3px solid #212121;border-radius:12px">
<h1 style="font-size:24px">Xác nhận tài khoản</h1>
<p>Nhập mã dưới đây trong ứng dụng Weather để xác nhận email của bạn.</p>
<p style="padding:20px;background:#FFC107;border:2px solid #212121;border-radius:12px;font-size:32px;font-weight:bold;letter-spacing:6px;text-align:center">{{ .Token }}</p>
<p>Mã chỉ dùng một lần. Không chia sẻ mã với người khác. Nếu mã đã hết hạn, hãy yêu cầu mã mới trong ứng dụng.</p>
<p>Nếu bạn không tạo tài khoản, hãy bỏ qua email này.</p>
</div></body></html>
